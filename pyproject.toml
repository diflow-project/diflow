[build-system]
requires = ["setuptools>=78.1.1,<84", "wheel>=0.46.2,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "diflow"
version = "0.1.0"
description = "Turn complex diffusion workflows into efficient, scalable and modular services."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Lingyun Yang", email = "lyangbk@cse.ust.hk" },
]
keywords = ["diffusion", "serving", "workflow", "gpu", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "accelerate>=1.4,<2",
    "aiohttp>=3.14.3,<4",
    "fastapi>=0.141.1,<0.142",
    "filelock>=3.13,<4",
    "httpx>=0.28,<1",
    "huggingface-hub>=1.23,<2",
    "mpi4py>=4.1,<5",
    "numpy>=2.2,<3",
    "opencv-python>=4.11,<5",
    "overrides>=7.7,<8",
    "peft>=0.20,<0.21",
    "pillow>=12.3,<13",
    "protobuf>=5.29,<6",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "pyzmq>=26.2,<28",
    "regex!=2019.12.17",
    "requests>=2.33,<3",
    "safetensors>=0.8,<1",
    "sentencepiece>=0.2.1,<0.3",
    "starlette>=1.3.1,<2",
    "torch==2.6.0",
    "transformers==5.15.1",
    "uvicorn>=0.34,<0.53",
]

[project.optional-dependencies]
# The release wheel includes the NVSHMEM extension; this extra installs the
# runtime libraries needed to activate it instead of the host-memory fallback.
nvshmem = [
    "nvidia-nvshmem-cu12==3.7.1; sys_platform == 'linux'",
]
# Kept as a compatibility alias; model dependencies are now installed by default
# so a release wheel can run the built-in workflows immediately.
models = []
dev = [
    "auditwheel>=6,<7",
    "black>=26.3.1,<27",
    "build>=1.2,<2",
    "isort>=5.13,<7",
    "pre-commit>=4.1,<5",
    "pytest>=9.0.3,<10",
    "pytest-subtests>=0.14,<1",
    "twine>=6,<7",
]

[project.scripts]
diflow = "diflow.cli.main:main"

[project.urls]
Documentation = "https://github.com/diflow-project/diflow/tree/main/docs"
Issues = "https://github.com/diflow-project/diflow/issues"
Repository = "https://github.com/diflow-project/diflow"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["diflow*", "workflow_hub*", "benchmark_ops*"]

[tool.setuptools.package-data]
diflow = [
    "configs/*.json",
    "configs/*.yaml",
]
"diflow._vendor.diffusers" = [
    "LICENSE",
    "py.typed",
    "**/*.md",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
