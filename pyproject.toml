[build-system]
requires = ["setuptools>=78.1.1,<84", "wheel>=0.46.2,<0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "diflow"
version = "0.1.0"
description = "Turn complex diffusion workflows into efficient, scalable and modular services."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Lingyun Yang", email = "lyangbk@cse.ust.hk" },
]
keywords = ["diffusion", "serving", "workflow", "gpu", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "aiohttp>=3.14.3,<4",
    "fastapi>=0.141.1,<0.142",
    "mpi4py>=4.1,<5",
    "numpy>=2.2,<3",
    "overrides>=7.7,<8",
    "pillow>=12.3,<13",
    "protobuf>=5.29,<6",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "pyzmq>=26.2,<28",
    "requests>=2.33,<3",
    "sentencepiece>=0.2.1,<0.3",
    "starlette>=1.3.1,<2",
    "torch==2.5.1",
    "transformers==4.56.2",
    "uvicorn>=0.34,<0.53",
]

[project.optional-dependencies]
nvshmem = [
    "nvidia-nvshmem-cu12==3.7.1; sys_platform == 'linux'",
]
models = [
    "accelerate>=1.4,<2",
    "huggingface-hub>=0.35,<1",
    "opencv-python>=4.11,<5",
    "peft>=0.17,<0.18",
    "safetensors>=0.5,<1",
]
dev = [
    "black>=26.3.1,<27",
    "build>=1.2,<2",
    "isort>=5.13,<7",
    "pre-commit>=4.1,<5",
    "pytest>=9.0.3,<10",
    "pytest-subtests>=0.14,<1",
    "twine>=6,<7",
]

[project.scripts]
diflow = "diflow.cli.main:main"

[project.urls]
Documentation = "https://github.com/diflow-project/DiFlow/tree/main/docs"
Issues = "https://github.com/diflow-project/DiFlow/issues"
Repository = "https://github.com/diflow-project/DiFlow"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["diflow*", "workflow_hub*", "benchmark_ops*"]

[tool.setuptools.package-data]
diflow = [
    "configs/*.json",
    "configs/*.yaml",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
